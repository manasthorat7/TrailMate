# Render Blueprint for TrailMate.
#
# Creates one Render Postgres database and one Python web service that shares
# it. Secrets are either generated by Render (SECRET_KEY) or prompted for in
# the dashboard (sync: false); no secret values belong in this file.
#
# The start command runs the idempotent schema/admin bootstrap before Gunicorn.
# Render's preDeployCommand is only available on paid compute plans, so a free
# web service must initialize during startup instead. This also works without
# shell access. Later restarts detect the existing admin and make no changes.
#
# Fresh PostgreSQL databases do not need the legacy migration scripts:
# db.create_all() creates the complete current schema.
#
# See the deployment checklist in the final report for the full procedure.

databases:
  - name: trailmate-db
    databaseName: trailmate
    user: trailmate
    plan: free  # Free Postgres expires 30 days after creation; upgrade before then to keep data.
    postgresMajorVersion: "16"
    ipAllowList: []  # Private network only; the web service connects internally.

services:
  - type: web
    name: trailmate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: 'sh -c "python migrate_add_trek_price.py && flask --app wsgi init-db && gunicorn --bind 0.0.0.0:$PORT wsgi:app"'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trailmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Prompted once at Blueprint creation. ADMIN_PASSWORD is only used when no
      # administrator exists yet; later restarts preserve the existing admin.
      - key: ADMIN_NAME
        value: TrailMate Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Razorpay and Cloudinary credentials are optional for startup. Add them
      # in the dashboard after the first deploy if those features are needed.
      - key: PAYMENT_CURRENCY
        value: INR
      - key: PAYMENT_PENDING_EXPIRY_MINUTES
        value: "15"
