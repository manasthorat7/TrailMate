{% extends "admin/admin_layout.html" %}
{% block title %}{% if trek %}Edit Trek{% else %}Add Trek{% endif %}{% endblock %}
{% block admin_content %}
<h3 class="page-title">{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}</h3>
<p class="page-subtitle">Enter trek details carefully before saving.</p>

<div class="glass-card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Trek Name</label>
                    <input type="text" class="form-control" name="trek_name" value="{{ trek.trek_name if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Location</label>
                    <input type="text" class="form-control" name="location" value="{{ trek.location if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Difficulty</label>
                    <select class="form-select" name="difficulty">
                        <option {% if trek and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option {% if trek and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option {% if trek and trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Duration (e.g. 5 Days)</label>
                    <input type="text" class="form-control" name="duration" value="{{ trek.duration if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Available Slots</label>
                    <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Assign Staff (Optional)</label>
                    <select class="form-select" name="assigned_staff_id">
                        <option value="">-- Select Staff --</option>
                        {% for staff in active_staff %}
                            <option value="{{ staff.id }}" {% if trek and trek.assigned_staff_id == staff.id %}selected{% endif %}>{{ staff.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Start Date</label>
                    <input type="date" class="form-control" name="start_date" value="{{ trek.start_date if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>End Date</label>
                    <input type="date" class="form-control" name="end_date" value="{{ trek.end_date if trek else '' }}" required>
                </div>
                {% if trek %}
                <div class="col-md-6 mb-3">
                    <label>Status</label>
                    <select class="form-select" name="status">
                        <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                        <option value="Started" {% if trek.status == 'Started' %}selected{% endif %}>Started</option>
                        <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
