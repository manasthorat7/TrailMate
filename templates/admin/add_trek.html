{% extends "admin/admin_layout.html" %}
{% block title %}Add Trek{% endblock %}
{% block admin_content %}
<h4>Add New Trek</h4>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Trek Name</label>
                    <input type="text" class="form-control" name="trek_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Location</label>
                    <input type="text" class="form-control" name="location" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Difficulty</label>
                    <select class="form-select" name="difficulty">
                        <option>Easy</option>
                        <option>Moderate</option>
                        <option>Hard</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Duration (e.g. 5 Days)</label>
                    <input type="text" class="form-control" name="duration" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Available Slots</label>
                    <input type="number" class="form-control" name="available_slots" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Assign Staff (Optional)</label>
                    <select class="form-select" name="assigned_staff_id">
                        <option value="">-- Select Staff --</option>
                        {% for staff in active_staff %}
                            <option value="{{ staff.user_id }}">{{ staff.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Start Date</label>
                    <input type="date" class="form-control" name="start_date" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>End Date</label>
                    <input type="date" class="form-control" name="end_date" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
