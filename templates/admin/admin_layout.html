{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>Trekking Management Application</h4>
    <div>
        <span class="me-3">👤 Admin</span>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</div>
<div class="row">
    <div class="col-md-3">
        <div class="list-group">
            <a href="{{ url_for('admin.dashboard') }}" class="list-group-item list-group-item-action">Dashboard</a>
            <a href="{{ url_for('admin.manage_treks') }}" class="list-group-item list-group-item-action">Treks</a>
            <a href="{{ url_for('admin.manage_staff') }}" class="list-group-item list-group-item-action">Staff</a>
            <a href="{{ url_for('admin.manage_users') }}" class="list-group-item list-group-item-action">Users</a>
            <a href="{{ url_for('admin.view_bookings') }}" class="list-group-item list-group-item-action">Bookings</a>
        </div>
    </div>
    <div class="col-md-9">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
