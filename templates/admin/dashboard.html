{% extends "admin/admin_layout.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block admin_content %}
<h4>Dashboard</h4>
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>Total Treks</h6>
                <h2>{{ total_treks }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>Total Users</h6>
                <h2>{{ total_users }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>Total Staff</h6>
                <h2>{{ total_staff }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h6>Total Bookings</h6>
                <h2>{{ total_bookings }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
