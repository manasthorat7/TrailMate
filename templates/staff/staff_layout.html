{% extends "base.html" %}
{% block content %}
<div class="app-wrapper">
    <div class="sidebar d-flex flex-column">
        <div class="mb-4 text-center">
            <h4 class="text-white fw-bold mb-0">TrailMate</h4>
            <small class="text-white-50">Staff Panel</small>
        </div>

        <div class="list-group list-group-flush flex-grow-1">
            <a href="{{ url_for('staff.dashboard') }}" class="list-group-item list-group-item-action">Dashboard</a>
            <a href="{{ url_for('staff.assigned_treks') }}" class="list-group-item list-group-item-action">My Treks</a>
        </div>

        <div class="mt-auto pt-4 border-top border-secondary">
            <div class="d-flex justify-content-between align-items-center">
                <span class="small text-white-50 text-truncate me-2">{{ current_user.name }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm px-3">Logout</a>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="page-box">
            {% block staff_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
