{% extends "staff/staff_layout.html" %}
{% block title %}Assigned Treks{% endblock %}
{% block staff_content %}
<h4>My Assigned Treks</h4>
<table class="table table-bordered bg-white shadow-sm">
    <thead>
        <tr>
            <th>Trek Name</th>
            <th>Location</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for trek in treks %}
        <tr>
            <td>{{ trek.trek_name }}</td>
            <td>{{ trek.location }}</td>
            <td>{{ trek.status }}</td>
            <td>
                <form method="POST" action="{{ url_for('staff.update_status', trek_id=trek.trek_id) }}">
                    <select name="status" class="form-select form-select-sm d-inline w-auto">
                        <option value="Upcoming" {% if trek.status == 'Upcoming' %}selected{% endif %}>Upcoming</option>
                        <option value="Ongoing" {% if trek.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                        <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">Update</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
