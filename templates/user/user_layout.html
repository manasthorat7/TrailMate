{% extends "base.html" %}
{% block content %}
<div class="nav-island">
    <div class="d-flex align-items-center">
        <h4 class="mb-0 me-4"><span class="logo-trail">Trail</span><span class="logo-mate">Mate</span></h4>
        <span class="badge bg-light text-forest me-3">User Portal</span>
    </div>
    <div class="nav-island-links d-flex align-items-center flex-wrap">
        <a href="{{ url_for('user.dashboard') }}">Browse Treks</a>
        <a href="{{ url_for('user.my_bookings') }}">My Bookings</a>
        <a href="{{ url_for('user.history') }}">History</a>
        <a href="{{ url_for('user.profile') }}">Profile</a>
    </div>
    <div class="d-flex align-items-center">
        <span class="text-white-50 small text-truncate me-3">{{ current_user.name }}</span>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</a>
    </div>
</div>

<div class="floating-card">
    {% block user_content %}{% endblock %}
</div>
{% endblock %}
