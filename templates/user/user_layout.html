{% extends "base.html" %}
{% block content %}
<nav class="tm-navbar">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
            <a href="{{ url_for('auth.index') }}" class="brand-logo">
                <i class="bi bi-compass-fill logo-icon"></i>
                <span class="logo-trail">Trail</span><span class="logo-mate">Mate</span>
            </a>
            <span class="portal-badge d-none d-sm-inline-block">Trekker Portal</span>
        </div>

        <div class="d-flex align-items-center flex-wrap gap-1 order-3 order-md-2 mt-2 mt-md-0">
            <a href="{{ url_for('user.dashboard') }}" class="nav-link {% if request.endpoint == 'user.dashboard' %}active{% endif %}">
                <i class="bi bi-compass"></i> Browse Treks
            </a>
            <a href="{{ url_for('user.my_bookings') }}" class="nav-link {% if request.endpoint == 'user.my_bookings' %}active{% endif %}">
                <i class="bi bi-ticket-perforated"></i> My Bookings
            </a>
            <a href="{{ url_for('user.history') }}" class="nav-link {% if request.endpoint == 'user.history' %}active{% endif %}">
                <i class="bi bi-clock-history"></i> History
            </a>
            <a href="{{ url_for('user.profile') }}" class="nav-link {% if request.endpoint == 'user.profile' %}active{% endif %}">
                <i class="bi bi-person"></i> Profile
            </a>
        </div>

        <div class="d-flex align-items-center gap-2 order-2 order-md-3">
            <span class="user-chip d-none d-sm-inline-flex">
                <i class="bi bi-person-circle"></i> {{ current_user.name }}
            </span>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm btn-pill">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<main class="portal-container">
    <div class="container">
        {% block user_content %}{% endblock %}
    </div>
</main>

<footer class="py-4 border-top text-center text-muted small bg-white mt-auto">
    <div class="container">
        &copy; 2026 TrailMate &bull; Certified Mountain Adventures & Expeditions
    </div>
</footer>
{% endblock %}
