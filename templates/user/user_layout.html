{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>Trekking Management Application</h4>
    <div>
        <span class="me-3">👤 {{ current_user.name }}</span>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</div>
<div class="row">
    <div class="col-md-3">
        <div class="list-group">
            <a href="{{ url_for('user.dashboard') }}" class="list-group-item list-group-item-action">Browse Treks</a>
            <a href="{{ url_for('user.my_bookings') }}" class="list-group-item list-group-item-action">My Bookings</a>
            <a href="{{ url_for('user.history') }}" class="list-group-item list-group-item-action">History</a>
            <a href="{{ url_for('user.profile') }}" class="list-group-item list-group-item-action">Profile</a>
        </div>
    </div>
    <div class="col-md-9">
        {% block user_content %}{% endblock %}
    </div>
</div>
{% endblock %}
