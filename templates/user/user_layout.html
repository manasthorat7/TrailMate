{% extends "base.html" %}
{% block content %}
<div class="app-wrapper">
    <div class="sidebar d-flex flex-column">
        <div class="mb-4 text-center">
            <h4 class="text-white fw-bold mb-0"><span class="logo-trail">Trail</span><span class="logo-mate">Mate</span></h4>
            <small class="text-white-50">User Portal</small>
        </div>

        <div class="list-group list-group-flush flex-grow-1">
            <a href="{{ url_for('user.dashboard') }}" class="list-group-item list-group-item-action">Browse Treks</a>
            <a href="{{ url_for('user.my_bookings') }}" class="list-group-item list-group-item-action">My Bookings</a>
            <a href="{{ url_for('user.history') }}" class="list-group-item list-group-item-action">History</a>
            <a href="{{ url_for('user.profile') }}" class="list-group-item list-group-item-action">Profile</a>
        </div>

        <div class="mt-auto pt-4 border-top border-secondary">
            <div class="d-flex justify-content-between align-items-center">
                <span class="small text-white-50 text-truncate me-2">{{ current_user.name }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm px-3">Logout</a>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="page-box">
            {% block user_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
