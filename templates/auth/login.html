{% extends "base.html" %}
{% block title %}Sign In &bull; TrailMate Expeditions{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="{{ url_for('auth.index') }}" class="brand-logo brand-dark mb-3">
                    <i class="bi bi-compass-fill logo-icon"></i>
                    <span class="logo-trail">Trail</span><span class="logo-mate">Mate</span>
                </a>
                <h3>Login / Sign In</h3>
                <p>Access your expeditions, bookings, and portal.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
                </button>

                <div class="text-center pt-2 border-top">
                    <p class="small text-muted mb-2">
                        Don't have an account yet? 
                        <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none">Create Account</a>
                    </p>
                    <a href="{{ url_for('auth.index') }}" class="small text-secondary text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Return to Homepage
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
