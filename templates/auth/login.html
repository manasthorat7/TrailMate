{% extends "base.html" %}
{% block title %}Login - TrailMate{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="w-100" style="max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1"><span class="logo-trail">Trail</span><span class="logo-mate">Mate</span></h2>
            <p class="text-white-50">Trekking Management Application</p>
        </div>
        <div class="card border-0 shadow-sm glass-card">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center">Login</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-sunrise w-100 mb-3">Sign In</button>
                    <p class="text-center text-muted mb-0">New here? <a href="{{ url_for('auth.register') }}" class="auth-link text-decoration-none fw-bold">Register</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
