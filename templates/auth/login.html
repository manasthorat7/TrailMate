{% extends "base.html" %}
{% block title %}Login - TrailMate{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h4 class="mb-0">Trekking Management Application</h4></div>
            <div class="card-body p-4 text-center">
                <h3 class="mb-4">Login</h3>
                <form method="POST">
                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                    <p class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
