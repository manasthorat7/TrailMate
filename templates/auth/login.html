{% extends "base.html" %}

{% block title %}Login - TrailMate{% end block %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <h3 class="text-center mb-4 text-forest fw-bold">Login to TrailMate</h3>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    
                    <div class="d-grid">
                        <button class="btn btn-forest btn-lg" type="submit">Login</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-forest fw-bold text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% end block %}
